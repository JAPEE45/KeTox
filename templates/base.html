<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="{% block meta_description %}KeTox — CYP3A4 hepatotoxicity prediction using Ketoconazole as a reference standard. Powered by Random Forest and Graph Convolutional Network models.{% endblock %}"
    />
    <title>
      {% block title %}KeTox{% endblock %} | CYP3A4 Hepatotoxicity Predictor
    </title>

    <!-- Google Fonts: Inter + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS v4 Browser CDN — processes all Tailwind classes in this page at runtime.
       For production, replace with compiled output from:
         ./tailwindcss.exe -i static/css/input.css -o static/css/output.css --minify       -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <!-- Custom styles: animations, tooltips, gauges, verdict card styles -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/output.css') }}"
    />

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <!-- Custom Tailwind theme + component classes (processed by browser CDN) -->
    <style type="text/tailwindcss">
      @theme {
        --font-family-sans: "Inter", system-ui, -apple-system, sans-serif;
        --font-family-mono: "JetBrains Mono", "Fira Code", monospace;

        --color-navy-50: #f0f4f9;
        --color-navy-100: #dde6f0;
        --color-navy-200: #b9cde2;
        --color-navy-300: #8aaed0;
        --color-navy-700: #25476e;
        --color-navy-800: #1e3a5f;
        --color-navy-900: #152a47;

        --color-teal-ketox: #0d9488;

        --color-toxic: #dc2626;
        --color-toxic-light: #fef2f2;
        --color-toxic-border: #fca5a5;
        --color-safe: #16a34a;
        --color-safe-light: #f0fdf4;
        --color-safe-border: #86efac;
        --color-elevated: #d97706;
      }

      @layer components {
        .card {
          @apply bg-white rounded-xl border border-slate-200 shadow-sm;
        }
        .card-elevated {
          @apply bg-white rounded-xl border border-slate-200 shadow-md;
        }

        .btn-primary {
          @apply bg-navy-800 text-white px-6 py-3 rounded-lg font-semibold text-sm
               hover:bg-navy-700 active:scale-[0.98]
               transition-all duration-200 flex items-center justify-center gap-2
               disabled:opacity-50 disabled:cursor-not-allowed;
        }
        .btn-tab {
          @apply px-4 py-2 text-sm font-medium rounded-lg transition-all duration-200
               text-slate-500 hover:text-slate-700 hover:bg-slate-100;
        }
        .btn-tab-active {
          @apply bg-navy-800 text-white shadow-sm;
        }

        .badge-toxic {
          @apply bg-red-100  text-red-700  border border-red-200  px-3 py-1 rounded-full text-sm  font-bold  tracking-wide;
        }
        .badge-safe {
          @apply bg-green-100 text-green-700 border border-green-200 px-3 py-1 rounded-full text-sm font-bold tracking-wide;
        }
        .badge-elevated {
          @apply bg-amber-100 text-amber-700 border border-amber-200 px-2.5 py-0.5 rounded-full text-xs font-semibold;
        }
        .badge-normal {
          @apply bg-green-100 text-green-700 border border-green-200 px-2.5 py-0.5 rounded-full text-xs font-semibold;
        }
        .badge-sibling {
          @apply bg-orange-100 text-orange-700 border border-orange-200 px-2.5 py-0.5 rounded-full text-xs font-semibold;
        }
        .badge-stranger {
          @apply bg-slate-100 text-slate-600 border border-slate-200 px-2.5 py-0.5 rounded-full text-xs font-semibold;
        }

        .input-smiles {
          @apply w-full font-mono text-sm bg-slate-50 border border-slate-300 rounded-lg px-4 py-3
               focus:outline-none focus:ring-2 focus:ring-navy-800 focus:border-navy-800
               transition-all duration-200 placeholder:text-slate-400;
        }
        .chip {
          @apply inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium
               border border-slate-200 bg-white text-slate-600
               hover:border-navy-300 hover:text-navy-700 hover:bg-navy-50
               cursor-pointer transition-all duration-150 select-none;
        }
        .chip-toxic {
          @apply border-red-200  bg-red-50  text-red-700  hover:border-red-300  hover:bg-red-100;
        }
        .chip-safe {
          @apply border-green-200 bg-green-50 text-green-700 hover:border-green-300 hover:bg-green-100;
        }

        .section-label {
          @apply text-xs font-semibold uppercase tracking-widest text-slate-400;
        }

        .skeleton {
          @apply bg-slate-200 rounded animate-pulse;
        }
      }
    </style>

    {% block head %}{% endblock %}
  </head>
  <body
    class="bg-slate-50 text-slate-900 antialiased min-h-screen flex flex-col"
  >
    <!-- ═══════════════════════════ NAVIGATION ═══════════════════════════ -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <!-- Wordmark -->
          <a
            href="/"
            class="flex items-center gap-3 group"
            aria-label="KeTox Home"
          >
            <div
              class="w-9 h-9 bg-navy-800 rounded-xl flex items-center justify-center flex-shrink-0 shadow-sm group-hover:bg-navy-700 transition-colors duration-200"
            >
              <svg
                viewBox="0 0 24 24"
                class="w-5 h-5 fill-white"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="2.2" />
                <circle cx="4.5" cy="7.5" r="1.6" />
                <circle cx="19.5" cy="7.5" r="1.6" />
                <circle cx="4.5" cy="16.5" r="1.6" />
                <circle cx="19.5" cy="16.5" r="1.6" />
                <circle cx="12" cy="3" r="1.3" />
                <circle cx="12" cy="21" r="1.3" />
                <line
                  x1="12"
                  y1="9.8"
                  x2="5.8"
                  y2="8.9"
                  stroke="white"
                  stroke-width="1.3"
                  stroke-linecap="round"
                />
                <line
                  x1="12"
                  y1="9.8"
                  x2="18.2"
                  y2="8.9"
                  stroke="white"
                  stroke-width="1.3"
                  stroke-linecap="round"
                />
                <line
                  x1="12"
                  y1="14.2"
                  x2="5.8"
                  y2="15.1"
                  stroke="white"
                  stroke-width="1.3"
                  stroke-linecap="round"
                />
                <line
                  x1="12"
                  y1="14.2"
                  x2="18.2"
                  y2="15.1"
                  stroke="white"
                  stroke-width="1.3"
                  stroke-linecap="round"
                />
                <line
                  x1="12"
                  y1="9.8"
                  x2="12"
                  y2="4.3"
                  stroke="white"
                  stroke-width="1.3"
                  stroke-linecap="round"
                />
                <line
                  x1="12"
                  y1="14.2"
                  x2="12"
                  y2="19.7"
                  stroke="white"
                  stroke-width="1.3"
                  stroke-linecap="round"
                />
              </svg>
            </div>
            <div class="leading-tight">
              <div class="text-lg font-bold text-navy-900 tracking-tight">
                KeTox
              </div>
              <div
                class="text-[10px] text-slate-500 font-medium hidden sm:block"
              >
                CYP3A4 Hepatotoxicity Predictor
              </div>
            </div>
          </a>

          <!-- Nav links -->
          <div class="flex items-center gap-0.5">
            <a
              href="/"
              data-nav-path="/"
              class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-navy-800 hover:bg-navy-50 transition-all duration-200"
              >Home</a
            >
            <a
              href="/about"
              data-nav-path="/about"
              class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-navy-800 hover:bg-navy-50 transition-all duration-200"
              >About</a
            >
            <a
              href="/performance"
              data-nav-path="/performance"
              class="px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-navy-800 hover:bg-navy-50 transition-all duration-200"
              >Model Performance</a
            >
          </div>
        </div>
      </div>
    </nav>

    <!-- ═══════════════════════════ MAIN CONTENT ═════════════════════════ -->
    <main class="flex-1 flex flex-col">{% block content %}{% endblock %}</main>

    <!-- Scripts: ui.js → charts.js → predict.js (order matters) -->
    <script src="{{ url_for('static', filename='js/ui.js') }}"></script>
    <script src="{{ url_for('static', filename='js/charts.js') }}"></script>
    <script src="{{ url_for('static', filename='js/predict.js') }}"></script>

    <!-- Lucide icon init (after DOM ready) -->
    <script>
      document.addEventListener("DOMContentLoaded", () => lucide.createIcons());
    </script>

    {% block scripts %}{% endblock %}
  </body>
</html>
