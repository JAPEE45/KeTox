<!doctype html>

<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="{% block meta_description %}KeTox — CYP3A4 hepatotoxicity prediction using Ketoconazole as a reference standard. Powered by Random Forest and Graph Convolutional Network models.{% endblock %}"
    />

    <title>
      {% block title %}KeTox{% endblock %} | CYP3A4 Hepatotoxicity Predictor
    </title>

    <!-- Google Fonts: Plus Jakarta Sans, Outfit, Inter + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS v4 Browser CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <!-- Tailwind CLI build output (utility classes when CDN is removed) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}" />

    <!-- Hand-authored styles: tokens, components, animations, gauges, etc.
         All colours reference CSS custom properties defined in custom.css :root.
         Source of truth for design tokens — edit here, not in output.css. -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}" />

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <!--
      Component classes (.badge-*, .btn-*, .chip-*, .card, etc.) live in
      static/css/output.css as plain CSS — no inline @apply block needed.
      Tailwind utility classes (bg-*, text-*, flex, grid, etc.) are handled
      by the browser CDN above during development.
    -->

    {% block head %}{% endblock %}
  </head>

  <body
    class="bg-neutral-50 text-neutral-900 antialiased min-h-screen flex flex-col"
  >
    {% if request.path == '/' %}
    <!-- ═══════════════════════════ PARTICLE CANVAS (Home only) ══════════ -->
    <canvas
      id="particle-canvas"
      style="
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
      "
      aria-hidden="true"
    ></canvas>
    {% endif %}

    <!-- ═══════════════════════════ NAVIGATION ═══════════════════════════ -->

    <nav
      class="sticky top-0 z-40 bg-neutral-50/85 backdrop-blur-md"
      style="
        background-color: rgba(250, 250, 250, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      "
    >
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <!-- Wordmark -->

          <a
            href="/"
            class="flex items-center gap-3 group"
            aria-label="KeTox Home"
          >
            <div
              class="w-9 h-9 bg-black rounded-xl flex items-center justify-center flex-shrink-0 shadow-sm group-hover:bg-neutral-800 transition-colors duration-200"
            >
              <svg
                viewBox="0 0 24 24"
                class="w-5 h-5 fill-white"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="2.2" />

                <circle cx="4.5" cy="7.5" r="1.6" />

                <circle cx="19.5" cy="7.5" r="1.6" />

                <circle cx="4.5" cy="16.5" r="1.6" />

                <circle cx="19.5" cy="16.5" r="1.6" />

                <circle cx="12" cy="3" r="1.3" />

                <circle cx="12" cy="21" r="1.3" />

                <line
                  x1="12"
                  y1="9.8"
                  x2="5.8"
                  y2="8.9"
                  stroke="white"
                  stroke-width="1.3"
                  stroke-linecap="round"
                />

                <line
                  x1="12"
                  y1="9.8"
                  x2="18.2"
                  y2="8.9"
                  stroke="white"
                  stroke-width="1.3"
                  stroke-linecap="round"
                />

                <line
                  x1="12"
                  y1="14.2"
                  x2="5.8"
                  y2="15.1"
                  stroke="white"
                  stroke-width="1.3"
                  stroke-linecap="round"
                />

                <line
                  x1="12"
                  y1="14.2"
                  x2="18.2"
                  y2="15.1"
                  stroke="white"
                  stroke-width="1.3"
                  stroke-linecap="round"
                />

                <line
                  x1="12"
                  y1="9.8"
                  x2="12"
                  y2="4.3"
                  stroke="white"
                  stroke-width="1.3"
                  stroke-linecap="round"
                />

                <line
                  x1="12"
                  y1="14.2"
                  x2="12"
                  y2="19.7"
                  stroke="white"
                  stroke-width="1.3"
                  stroke-linecap="round"
                />
              </svg>
            </div>

            <div class="leading-tight">
              <div class="text-xl font-bold text-black tracking-tight">
                KeTox
              </div>

              <div class="text-xs text-neutral-500 font-medium hidden sm:block">
                CYP3A4 Hepatotoxicity Predictor
              </div>
            </div>
          </a>

          <!-- Desktop Nav links (hidden on mobile) -->
          <div class="hidden md:flex items-center gap-1">
            <a
              href="/"
              data-nav-path="/"
              class="px-4 py-2.5 rounded-lg text-base font-medium text-neutral-600 hover:text-black hover:bg-neutral-100 transition-all duration-200"
              >Home</a
            >
            <a
              href="/about"
              data-nav-path="/about"
              class="px-4 py-2.5 rounded-lg text-base font-medium text-neutral-600 hover:text-black hover:bg-neutral-100 transition-all duration-200"
              >About</a
            >
            <a
              href="/performance"
              data-nav-path="/performance"
              class="px-4 py-2.5 rounded-lg text-base font-medium text-neutral-600 hover:text-black hover:bg-neutral-100 transition-all duration-200"
              >Model Performance</a
            >
          </div>

          <!-- Mobile Accordion Toggle Button (visible on mobile only) -->
          <div class="flex items-center md:hidden">
            <button
              id="mobile-nav-toggle"
              type="button"
              class="p-2 rounded-xl text-neutral-700 hover:text-black hover:bg-neutral-200/60 focus:outline-none transition-colors duration-200"
              aria-controls="mobile-nav-menu"
              aria-expanded="false"
              aria-label="Toggle navigation menu"
            >
              <!-- Hamburger / Accordion Icon -->
              <svg
                id="mobile-nav-icon-open"
                class="w-6 h-6 stroke-current transition-transform duration-200"
                viewBox="0 0 24 24"
                fill="none"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="4" y1="6" x2="20" y2="6" />
                <line x1="4" y1="12" x2="20" y2="12" />
                <line x1="4" y1="18" x2="20" y2="18" />
              </svg>
              <!-- Close Icon (hidden initially) -->
              <svg
                id="mobile-nav-icon-close"
                class="w-6 h-6 stroke-current hidden transition-transform duration-200"
                viewBox="0 0 24 24"
                fill="none"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- ═════════════════════════ MOBILE ACCORDION DRAWER ════════════════ -->
      <div
        id="mobile-nav-menu"
        class="md:hidden overflow-hidden transition-all duration-300 ease-in-out max-h-0 opacity-0"
        style="
          background-color: rgba(250, 250, 250, 0.96);
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        "
      >
        <div class="px-5 pt-3 pb-6 flex flex-col gap-2">
          <a
            href="/"
            data-nav-path="/"
            class="px-4 py-3 rounded-xl text-base font-semibold text-neutral-800 hover:text-black hover:bg-neutral-200/50 transition-colors flex items-center justify-between"
          >
            <span>Home</span>
            <svg class="w-4 h-4 opacity-40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </a>
          <a
            href="/about"
            data-nav-path="/about"
            class="px-4 py-3 rounded-xl text-base font-semibold text-neutral-800 hover:text-black hover:bg-neutral-200/50 transition-colors flex items-center justify-between"
          >
            <span>About</span>
            <svg class="w-4 h-4 opacity-40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </a>
          <a
            href="/performance"
            data-nav-path="/performance"
            class="px-4 py-3 rounded-xl text-base font-semibold text-neutral-800 hover:text-black hover:bg-neutral-200/50 transition-colors flex items-center justify-between"
          >
            <span>Model Performance</span>
            <svg class="w-4 h-4 opacity-40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </a>
        </div>
      </div>
    </nav>

    <!-- ═════════════════════════ MOBILE NAV SCRIPT ════════════════════════ -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const toggleBtn = document.getElementById("mobile-nav-toggle");
        const menu = document.getElementById("mobile-nav-menu");
        const iconOpen = document.getElementById("mobile-nav-icon-open");
        const iconClose = document.getElementById("mobile-nav-icon-close");

        if (!toggleBtn || !menu) return;

        let isOpen = false;

        function toggleMenu() {
          isOpen = !isOpen;
          toggleBtn.setAttribute("aria-expanded", isOpen);

          if (isOpen) {
            menu.style.maxHeight = menu.scrollHeight + "px";
            menu.classList.remove("max-h-0", "opacity-0");
            menu.classList.add("opacity-100");
            iconOpen.classList.add("hidden");
            iconClose.classList.remove("hidden");
          } else {
            menu.style.maxHeight = "0px";
            menu.classList.add("max-h-0", "opacity-0");
            menu.classList.remove("opacity-100");
            iconOpen.classList.remove("hidden");
            iconClose.classList.add("hidden");
          }
        }

        toggleBtn.addEventListener("click", toggleMenu);

        // Close on window resize to desktop
        window.addEventListener("resize", () => {
          if (window.innerWidth >= 768 && isOpen) {
            toggleMenu();
          }
        });
      });
    </script>

    <!-- ═══════════════════════════ MAIN CONTENT ═════════════════════════ -->

    <main class="flex-1 flex flex-col">{% block content %}{% endblock %}</main>

    <!-- Scripts: ui.js → charts.js → predict.js (order matters) -->

    <script src="{{ url_for('static', filename='js/ui.js') }}"></script>

    <script src="{{ url_for('static', filename='js/charts.js') }}"></script>

    <script src="{{ url_for('static', filename='js/predict.js') }}"></script>

    <!-- Lucide icon init (after DOM ready) -->

    <script>
      document.addEventListener("DOMContentLoaded", () => lucide.createIcons());
    </script>

    {% block scripts %}{% endblock %} {% if request.path == '/' %}
    <!-- =============== PARTICLE ANIMATION (Home only) =============== -->
    <script>
      (() => {
        const canvas = document.getElementById("particle-canvas");
        if (!canvas) return;

        const ctx = canvas.getContext("2d");

        // HSL palette – vivid hues that shift smoothly
        const PALETTE = [
          [217, 89, 61], // blue
          [4, 80, 58], // red
          [43, 96, 55], // yellow
          [145, 60, 44], // green
          [232, 47, 58], // indigo
          [175, 60, 40], // teal
          [21, 90, 59], // orange
          [280, 55, 55], // violet
          [195, 85, 52], // cyan
        ];

        const COUNT = 280;

        const CLUSTER_R = 340;

        const SPRING = 0.055;

        const DAMP = 0.82;

        const REPEL_R = 150;

        const REPEL_F = 7;

        const FOLLOW = 0.015; // lazy cursor-chase delay

        // Global breathing frequencies (millisecond-based, t = ms from rAF)

        const G_FREQ1 = 0.0006; // ~10s cycle

        const G_FREQ2 = 0.00097; // ~6.5s cycle

        // Size pulse: particles shrink to SIZE_MIN and return to 1.0 each breath

        // Synced to G_FREQ1 so the size pulse matches the cloud expand/compress

        const SIZE_MIN = 0.55; // shrink to 55% of base length (clearly visible)

        const SIZE_MAX = 1.0; // return to full length

        let W, H;

        let lastTime = 0;

        let clock = 0; // seconds, for wobble oscillators

        let mouse = { x: -1, y: -1 };

        let clusterX, clusterY;

        let particles = [];

        function rand(lo, hi) {
          return lo + Math.random() * (hi - lo);
        }

        function randInt(n) {
          return Math.floor(Math.random() * n);
        }

        function lerpHue(a, b, t) {
          let d = b - a;

          if (d > 180) d -= 360;

          if (d < -180) d += 360;

          return (a + d * t + 360) % 360;
        }

        class Particle {
          constructor() {
            this.init();
          }

          init() {
            const r = Math.sqrt(Math.random()) * CLUSTER_R;

            const theta = rand(0, Math.PI * 2);

            this.offX = r * Math.cos(theta);

            this.offY = r * Math.sin(theta);

            this.x = (clusterX || W / 2) + this.offX;

            this.y = (clusterY || H / 2) + this.offY;

            this.vx = 0;

            this.vy = 0;

            // Organic position wobble

            this.phX = rand(0, Math.PI * 2);

            this.phY = rand(0, Math.PI * 2);

            this.fqX = rand(0.5, 1.2);

            this.fqY = rand(0.4, 1.0);

            this.aX = rand(10, 24);

            this.aY = rand(8, 18);

            // Per-particle cloud-edge breathing (keeps shape organic, not a circle)

            this.bPhase = rand(0, Math.PI * 2);

            this.bFreq = rand(0.0008, 0.0018);

            this.bAmp = rand(0.07, 0.15);

            // Size pulse: each particle has a small personal phase offset

            // so they don't all shrink at exactly the same instant

            this.sizePhase = rand(-0.4, 0.4); // small random offset in seconds

            // Geometry

            this.baseLen = rand(5, 15);

            this.len = this.baseLen;

            this.thick = rand(1.2, 2.6);

            this.angle = rand(0, Math.PI);

            this.spin = rand(-0.008, 0.008);

            this.alpha = rand(0.5, 0.9);

            // Color cycling

            this.colA = randInt(PALETTE.length);

            this.colB =
              (this.colA + 1 + randInt(PALETTE.length - 1)) % PALETTE.length;

            this.colFreq = rand(0.00015, 0.0004);
          }

          // HSL color interpolated between two palette entries

          currentColor(t) {
            const progress =
              (Math.sin(t * this.colFreq * Math.PI * 2 + this.bPhase) + 1) / 2;

            const [hA, sA, lA] = PALETTE[this.colA];

            const [hB, sB, lB] = PALETTE[this.colB];

            const h = lerpHue(hA, hB, progress);

            const s = sA + (sB - sA) * progress;

            const l = lA + (lB - lA) * progress;

            return `hsl(${h.toFixed(1)},${s.toFixed(1)}%,${l.toFixed(1)}%)`;
          }

          update(t) {
            // ── Cloud position breathing (expand / compress) ──────────────────

            const globalScale =
              1 +
              0.22 * Math.sin(t * G_FREQ1) +
              0.1 * Math.sin(t * G_FREQ2 + 1.2);

            const localScale =
              1 + this.bAmp * Math.sin(t * this.bFreq + this.bPhase);

            const scale = globalScale * localScale;

            // Spring target (breathing + wobble)

            const tx =
              clusterX +
              this.offX * scale +
              Math.sin(clock * this.fqX + this.phX) * this.aX;

            const ty =
              clusterY +
              this.offY * scale +
              Math.cos(clock * this.fqY + this.phY) * this.aY;

            this.vx += (tx - this.x) * SPRING;

            this.vy += (ty - this.y) * SPRING;

            // Cursor repulsion

            if (mouse.x > 0) {
              const dx = this.x - mouse.x;

              const dy = this.y - mouse.y;

              const dist = Math.hypot(dx, dy) || 1;

              if (dist < REPEL_R) {
                const ratio = 1 - dist / REPEL_R;

                this.vx += (dx / dist) * ratio * ratio * REPEL_F;

                this.vy += (dy / dist) * ratio * ratio * REPEL_F;
              }
            }

            this.vx *= DAMP;

            this.vy *= DAMP;

            this.x += this.vx;

            this.y += this.vy;

            this.angle += this.spin;

            // ── Size pulse synced to global breath ────────────────────────────

            // sin goes -1 → +1; remap to SIZE_MIN → SIZE_MAX

            // Use clock (seconds) so it's frame-rate independent

            const breathCycle = Math.sin(
              (clock + this.sizePhase) * G_FREQ1 * 1000,
            );

            const lenScale =
              SIZE_MIN + (SIZE_MAX - SIZE_MIN) * ((breathCycle + 1) / 2);

            this.len = this.baseLen * lenScale;

            // Cache color

            this._color = this.currentColor(t);
          }

          draw() {
            ctx.save();

            ctx.globalAlpha = this.alpha;

            ctx.strokeStyle = this._color;

            ctx.lineWidth = this.thick;

            ctx.lineCap = "round";

            ctx.translate(this.x, this.y);

            ctx.rotate(this.angle);

            ctx.beginPath();

            ctx.moveTo(-this.len / 2, 0);

            ctx.lineTo(this.len / 2, 0);

            ctx.stroke();

            ctx.restore();
          }
        }

        function isMobile() {
          return window.innerWidth < 768;
        }

        function resize() {
          W = canvas.width = window.innerWidth;
          H = canvas.height = window.innerHeight;

          if (!clusterX) {
            clusterX = W / 2;
            clusterY = H / 2;
          }
        }

        function init() {
          if (isMobile()) {
            window.destroyParticles();
            return;
          }

          resize();
          clusterX = W / 2;
          clusterY = H / 2;
          particles = Array.from({ length: COUNT }, () => new Particle());
        }

        let animationFrameId = null;

        function loop(ts) {
          if (window._particleDestroyed || isMobile()) {
            window.destroyParticles();
            return;
          }

          const dt = Math.min(ts - lastTime, 50);
          lastTime = ts;
          clock += dt * 0.001; // advance clock in seconds

          const targetX = mouse.x > 0 ? mouse.x : W / 2;
          const targetY = mouse.x > 0 ? mouse.y : H / 2;

          clusterX += (targetX - clusterX) * FOLLOW;
          clusterY += (targetY - clusterY) * FOLLOW;

          ctx.clearRect(0, 0, W, H);

          for (const p of particles) {
            p.update(ts);
            p.draw();
          }

          animationFrameId = requestAnimationFrame(loop);
        }

        window.addEventListener("resize", () => {
          if (isMobile()) {
            window.destroyParticles();
            return;
          }
          resize();
          particles.forEach((p) => p.init());
        });

        window.addEventListener("mousemove", (e) => {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
        });

        window.addEventListener("mouseleave", () => {
          mouse.x = -1;
          mouse.y = -1;
        });

        window.addEventListener(
          "touchmove",
          (e) => {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
          },
          { passive: true },
        );

        window.addEventListener("touchend", () => {
          mouse.x = -1;
          mouse.y = -1;
        });

        // ── Public API: call to gracefully kill the animation ────────────
        window.destroyParticles = function () {
          if (window._particleDestroyed) return;
          window._particleDestroyed = true;

          if (animationFrameId) {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
          }
          loop = function () {};
          particles = [];

          if (ctx) {
            ctx.clearRect(0, 0, canvas.width || 0, canvas.height || 0);
          }

          // Hide canvas immediately
          canvas.style.display = "none";
          canvas.remove();
        };

        // Immediately destroy if user clicks About or Model Performance from Home
        document
          .querySelectorAll('a[href="/about"], a[href="/performance"]')
          .forEach((link) => {
            link.addEventListener("click", () => {
              window.destroyParticles?.();
            });
          });

        if (isMobile()) {
          window.destroyParticles();
        } else {
          init();
          animationFrameId = requestAnimationFrame(loop);
        }
      })();
    </script>
    {% endif %}
  </body>
</html>
